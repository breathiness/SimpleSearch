<!DOCTYPE html>
<!-- 由 scripts/build.mjs 从 templates/page.html 生成，请勿手改 -->
<html lang="zh-CN" data-theme="light" data-theme-default="{{THEME_DEFAULT}}" data-color="indigo">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <meta name="description" content="{{DESCRIPTION}}">
  <meta name="theme-color" content="{{THEME_COLOR}}">
  <meta property="og:title" content="{{TITLE}}">
  <meta property="og:description" content="{{DESCRIPTION}}">
  <meta property="og:type" content="website">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <script>
    // 防闪烁：样式表生效前确定主题。优先级与 theme.js 一致：
    // ?theme= 参数 → localStorage ss.theme → 系统深色偏好 → 浅色
    (function () {
      var el = document.documentElement
      var theme = null
      try {
        var matched = /[?&]theme=(light|dark)(?:&|$)/.exec(location.search || '')
        if (matched) theme = matched[1]
      } catch (e) {}
      if (!theme) {
        try {
          var stored = localStorage.getItem('ss.theme')
          if (stored === 'light' || stored === 'dark') theme = stored
        } catch (e) {}
      }
      if (!theme) {
        try {
          if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark'
        } catch (e) {}
      }
      el.setAttribute('data-theme', theme || 'light')
      // 主题色：在样式表生效前贴到 <html>，避免闪一下默认色
      var color = null
      try { color = localStorage.getItem('ss.color') } catch (e) {}
      // 只接受形如 indigo / deep-purple 的合法 id，其余落回默认色
      if (!/^[a-z][a-z-]{2,11}$/.test(color || '')) color = 'indigo'
      el.setAttribute('data-color', color)
    })()
  </script>
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/input.css">
</head>
<body>
{{ICON_SPRITE}}
  <a class="skip-link" href="#search-input">跳到搜索框</a>

  <header class="appbar">
    <button id="nav-toggle" class="appbar-icon" type="button" aria-label="打开站点分类"
            aria-expanded="false" aria-controls="site-nav">
      <svg class="appbar-icon-svg" aria-hidden="true" focusable="false"><use href="#i-menu"></use></svg>
    </button>
    <span class="appbar-logo" aria-hidden="true"><svg class="appbar-logo-svg" focusable="false"><use href="#i-logo"></use></svg></span>
    <span class="appbar-title">简单搜索</span>
    <button id="settings-toggle" class="appbar-icon" type="button" aria-label="设置"
            aria-expanded="false" aria-controls="settings-panel">
      <svg class="appbar-icon-svg" aria-hidden="true" focusable="false"><use href="#i-settings"></use></svg>
    </button>
  </header>

  <div class="shell">
    <aside id="site-nav" class="site-nav" aria-label="站点分类">
      <p class="nav-group-title">站点分类</p>
      <nav id="group-chips" class="nav-list" aria-label="按分类筛选站点">
{{GROUP_NAV}}
      </nav>
    </aside>

    <main id="main-content">
      <section class="card card-search" aria-label="搜索">
        <form id="search-form" role="search" action="https://www.bing.com/search" method="get" autocomplete="off">
          <div class="search-field">
            <input id="search-input" name="q" type="text" placeholder="搜索…" aria-label="搜索关键词"
                   aria-autocomplete="list" aria-controls="suggest-list" aria-expanded="false"
                   enterkeyhint="search" autocomplete="off" spellcheck="false" maxlength="512">
            <button id="clear-button" class="icon-button" type="button" aria-label="清除输入内容" hidden>✕</button>
            <ul id="suggest-list" class="suggest-list" role="listbox" aria-label="搜索建议" hidden></ul>
          </div>
          <button id="search-submit" class="submit-button" type="submit">搜索</button>
        </form>
        <noscript>
          <p class="noscript-hint">JavaScript 未启用：直接在输入框回车仍可用 Bing 搜索。</p>
        </noscript>
      </section>

      <section class="card card-sites" aria-label="常用网站">
        <h2 class="card-title">常用网站</h2>
        <nav id="buttons-container" aria-label="站点快捷按钮">
{{SITE_BUTTONS}}
        </nav>
      </section>
    </main>
  </div>

  <div id="scrim" class="scrim" hidden></div>

  <aside id="settings-panel" class="settings-panel" role="dialog" aria-modal="true"
         aria-labelledby="settings-title" hidden>
    <div class="panel-header">
      <h2 id="settings-title" class="panel-title">设置</h2>
      <button id="settings-close" class="icon-button panel-close" type="button" aria-label="关闭设置">
        <svg class="panel-close-svg" aria-hidden="true" focusable="false"><use href="#i-close"></use></svg>
      </button>
    </div>
    <div class="panel-body">
      <div class="settings-row">
        <span class="settings-label">主题模式</span>
        <div id="theme-mode" class="segmented" role="group" aria-label="主题模式">
          <button class="segmented-item" type="button" data-mode="auto" aria-pressed="true">跟随系统</button>
          <button class="segmented-item" type="button" data-mode="light" aria-pressed="false">浅色</button>
          <button class="segmented-item" type="button" data-mode="dark" aria-pressed="false">深色</button>
        </div>
      </div>
      <div class="settings-row">
        <span class="settings-label">主题色</span>
        <div id="color-swatches" class="swatches" role="group" aria-label="主题色"></div>
      </div>
      <button id="suggest-source-toggle" class="switch-row" type="button" aria-pressed="true">联网联想</button>
      <div class="settings-row settings-row-inline">
        <span class="settings-label">搜索历史 <span id="history-count" class="settings-value">0 条</span></span>
        <button id="history-clear" class="text-button" type="button" disabled>清空</button>
      </div>
      <a class="panel-link" href="https://github.com/breathiness/SimpleSearch">GitHub 仓库 · 关于</a>
      <p class="panel-version">简单搜索 v{{APP_VERSION}}</p>
    </div>
  </aside>

  <script defer src="assets/js/sites.js"></script>
  <script defer src="assets/js/search.js"></script>
  <script defer src="assets/js/suggest.js"></script>
  <script defer src="assets/js/history.js"></script>
  <script defer src="assets/js/theme.js"></script>
  <script defer src="assets/js/remote.js"></script>
  <script defer src="assets/js/input.js"></script>
  <script defer src="assets/js/app.js"></script>
</body>
</html>
