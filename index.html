<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>简单搜索 SimpleSearch</title>
  <meta name="description" content="一款超简单的聚合搜索网站：输入关键词，点击网站即可在该站内搜索；不输入则直接打开网站。">
  <meta name="theme-color" content="#f5f5f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#303030" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <style>
    /* 落地页：自包含的 MDUI 1 / Material Design 1 观感（与入口页同一套视觉语言）。
       颜色参考 MDUI 1 官方色表：primary #3f51b5，grey-100 #f5f5f5，grey-800 #424242。 */
    :root {
      --bg: #f5f5f5;
      --surface: #ffffff;
      --text: rgba(0, 0, 0, .87);
      --text-secondary: rgba(0, 0, 0, .54);
      --divider: rgba(0, 0, 0, .12);
      --primary: #3f51b5;
      --primary-bg: #3f51b5;
      --on-primary: #ffffff;
      --elevation-2: 0 1px 3px rgba(0, 0, 0, .12), 0 1px 2px rgba(0, 0, 0, .24);
      --elevation-4: 0 2px 4px -1px rgba(0, 0, 0, .2), 0 4px 5px 0 rgba(0, 0, 0, .14), 0 1px 10px 0 rgba(0, 0, 0, .12);
      --ease: cubic-bezier(.4, 0, .2, 1);
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #303030;
        --surface: #424242;
        --text: rgba(255, 255, 255, .87);
        --text-secondary: rgba(255, 255, 255, .7);
        --divider: rgba(255, 255, 255, .12);
        --primary: #9fa8da;
        --primary-bg: #3f51b5;
        color-scheme: dark;
      }
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
      padding: 48px 20px;
      border-top: 4px solid var(--primary-bg);
      background-color: var(--bg);
      color: var(--text);
      font-family: Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }
    header { max-width: 32rem; text-align: center; }
    h1 {
      margin: 0 0 8px;
      color: var(--primary);
      font-size: clamp(1.5rem, 5vw, 2rem);
      font-weight: 500;
      letter-spacing: .5px;
    }
    .lead { margin: 0; color: var(--text-secondary); font-size: 16px; }
    .cards {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      justify-content: center;
      width: 100%;
      max-width: 44rem;
    }
    /* MD1 卡片：2px 圆角 + elevation 2dp，hover 升到 4dp */
    .card {
      flex: 1 1 16rem;
      display: block;
      padding: 20px 24px;
      border: 1px solid var(--divider);
      border-radius: 2px;
      background-color: var(--surface);
      color: inherit;
      text-decoration: none;
      box-shadow: var(--elevation-2);
      transition: box-shadow 200ms var(--ease), background-color 200ms var(--ease);
    }
    @media (hover: hover) {
      .card:hover { box-shadow: var(--elevation-4); }
    }
    .card:active { box-shadow: var(--elevation-4); }
    .card strong {
      display: block;
      margin-bottom: 4px;
      color: var(--text);
      font-size: 16px;
      font-weight: 500;
    }
    .card span { color: var(--text-secondary); font-size: 14px; }
    .card:focus-visible, a:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }
    footer { color: var(--text-secondary); font-size: 14px; }
    footer a { color: var(--primary); text-decoration: none; }
    @media (hover: hover) { footer a:hover { text-decoration: underline; } }
    @media (prefers-reduced-motion: reduce) {
      .card { transition: none; }
    }
  </style>
</head>
<body>
  <header>
    <h1>简单搜索</h1>
    <p class="lead">输入关键词，点击网站即在该站内搜索；不输入则直接打开网站。</p>
  </header>
  <div class="cards">
    <a class="card" href="SimpleSearch-Light.html">
      <strong>浅色模式 →</strong>
      <span>明亮背景，白天使用</span>
    </a>
    <a class="card" href="SimpleSearch-Dark.html">
      <strong>夜间模式 →</strong>
      <span>深色背景，暗光环境更舒适</span>
    </a>
  </div>
  <footer>
    <a href="https://github.com/breathiness/SimpleSearch">GitHub 仓库</a> · MIT License
  </footer>
</body>
</html>
