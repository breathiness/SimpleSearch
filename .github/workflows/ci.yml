name: CI

# 只在 main 的 push 与 PR 上跑：分支 push 不再各跑一遍（同一 commit 只跑一次），
# 也顺带减少 Actions 通知；tag push 不触发（tag 指向的 commit 已在 main 上验证过）。
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: 构建、测试与校验
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 本项目零依赖：package.json 没有 dependencies / devDependencies，
      # 因此不需要 npm ci 或 npm install，checkout 后直接跑脚本即可。
      - name: 产物漂移检查
        # 必须在 npm run check 之前执行：check 里的 build 会重新写入产物，
        # 先 build 再 diff 才能发现「改了 sites.js / 模板却忘了提交生成页」的漂移。
        # sw.js 也是 build 产物（含版本号 + precache 列表），必须一起检查；
        # manifest.webmanifest / PWA 图标是手写静态文件，不参与 diff。
        run: |
          npm run build
          git diff --exit-code -- index.html SimpleSearch.html SimpleSearch-Light.html SimpleSearch-Dark.html sw.js assets

      - name: 构建、单元测试、静态校验
        run: npm run check

  e2e:
    name: 真实浏览器 E2E
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ubuntu-latest 自带 Google Chrome，scripts/e2e.mjs 的 findBrowser() 会找到
      # /usr/bin/google-chrome，所以这里同样不需要 npm install、不装任何依赖。
      # 只做行为断言（DOM/交互/网络），不做截图对比——跨平台字体差异只影响视觉，
      # 视觉回归留在本地按需跑（npm run visual）。
      - name: 真实浏览器端到端检查
        run: node scripts/e2e.mjs
